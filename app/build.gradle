plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.scanmap.org'
    compileSdk 34

    defaultConfig {
        applicationId "com.scanmap.org"
        // Android 5.0+ (API 21) — covers Android 8 and every older common phone
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        release {
            storeFile rootProject.file('keystore/release.keystore')
            storePassword project.findProperty('IM_STORE_PASS') ?: 'ScanMap2026survey'
            keyAlias 'scanmap'
            keyPassword project.findProperty('IM_KEY_PASS') ?: 'ScanMap2026survey'
            // v1 needed for Android 5.x/6.x sideload, v2 for 7.0+, v3 for 9+ rotation-proof
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
}
