name: Build Signed APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build signed release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk ScanMap-v1.0-signed.apk
          ls -la ScanMap-v1.0-signed.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScanMap-signed-apk
          path: ScanMap-v1.0-signed.apk

      - name: "Publish to release (tag latest)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest --repo "$GITHUB_REPOSITORY" \
              --title "ScanMap — Signed APK (latest)" \
              --notes "نسخه امضاشده برای نصب مستقیم روی اندروید. Signed APK for direct installation."
          gh release upload latest ScanMap-v1.0-signed.apk --repo "$GITHUB_REPOSITORY" --clobber
